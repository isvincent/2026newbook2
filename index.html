<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115 新書開箱・書香市集 ｜ 楊梅高中圖書館</title>
<style>
:root{
  --ink:#1f2440; --ink-soft:#5b6178; --paper:#fff9f2;
  --line:rgba(31,36,64,.10);
  --brand1:#ff7a59; --brand2:#ff3d8b; --brand3:#8b5cf6;
  --card:#ffffff; --radius:20px;
  --shadow:0 10px 30px rgba(31,36,64,.12);
  --shadow-lg:0 24px 60px rgba(31,36,64,.22);
  --fs-base:17px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-size:var(--fs-base); line-height:1.65; color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 12% -8%, #ffe3d0 0%, transparent 55%),
    radial-gradient(1000px 560px at 100% 0%, #ffd9ec 0%, transparent 55%),
    radial-gradient(1000px 700px at 50% 120%, #e6ddff 0%, transparent 55%),
    var(--paper);
  min-height:100vh;
}
.mono{font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
::selection{background:#ffd0a8}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px clamp(14px,4vw,42px);
  background:rgba(255,249,242,.82); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px; font-weight:900; font-size:1.15rem; letter-spacing:.5px}
.brand .logo{
  width:42px; height:42px; border-radius:13px; display:grid; place-items:center; font-size:1.4rem;
  background:linear-gradient(135deg,var(--brand1),var(--brand2)); box-shadow:0 6px 16px rgba(255,61,139,.4);
  transform:rotate(-6deg);
}
.brand small{display:block; font-size:.62rem; font-weight:700; color:var(--ink-soft); letter-spacing:2px}
.topbar .spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:9px 16px; font-weight:800; font-size:.92rem; color:var(--ink);
  display:inline-flex; align-items:center; gap:8px; transition:transform .15s, box-shadow .15s;
}
.iconbtn:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.iconbtn .badge{background:var(--brand2); color:#fff; border-radius:999px; min-width:22px; height:22px; padding:0 6px;
  display:grid; place-items:center; font-size:.78rem; font-weight:900}

/* ---------- Hero ---------- */
.hero{position:relative; overflow:hidden; padding:clamp(34px,7vw,72px) clamp(16px,5vw,48px) clamp(20px,4vw,40px)}
.hero-inner{max-width:1180px; margin:0 auto; position:relative; z-index:2}
.eyebrow{
  display:inline-flex; align-items:center; gap:9px; font-weight:900; letter-spacing:1px;
  background:#fff; border:2px solid #ffd7a8; color:#e8590c; padding:7px 16px; border-radius:999px; font-size:.9rem;
  box-shadow:0 6px 18px rgba(232,89,12,.15);
}
.hero h1{
  font-size:clamp(2.3rem,6.5vw,4.4rem); line-height:1.05; margin:.35em 0 .2em; font-weight:900; letter-spacing:-1px;
}
.hero h1 .grad{
  background:linear-gradient(100deg,var(--brand1),var(--brand2) 45%,var(--brand3));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p.lead{font-size:clamp(1.05rem,2.2vw,1.35rem); color:var(--ink-soft); max-width:640px; font-weight:600}
.stats{display:flex; flex-wrap:wrap; gap:14px; margin-top:26px}
.stat{
  background:var(--card); border-radius:16px; padding:14px 20px; box-shadow:var(--shadow);
  border:1px solid var(--line); min-width:118px;
}
.stat b{display:block; font-size:1.9rem; font-weight:900; line-height:1;
  background:linear-gradient(120deg,var(--brand1),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.stat span{font-size:.86rem; color:var(--ink-soft); font-weight:700}
/* floating deco books */
.float{position:absolute; z-index:1; border-radius:6px 10px 10px 6px; opacity:.9;
  box-shadow:0 12px 26px rgba(31,36,64,.18); animation:bob 6s ease-in-out infinite}
.float::before{content:""; position:absolute; left:0; top:0; bottom:0; width:8px; border-radius:6px 0 0 6px; background:rgba(0,0,0,.18)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-18px) rotate(var(--r))}}
@media (max-width:820px){.float{display:none}}

/* ---------- Controls ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 clamp(14px,4vw,42px)}
.panel{
  background:rgba(255,255,255,.72); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px clamp(16px,3vw,26px); margin-top:8px;
}
.searchrow{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.search{position:relative; flex:1; min-width:240px}
.search input{
  width:100%; font-size:1.08rem; font-weight:600; padding:14px 18px 14px 48px; border-radius:14px;
  border:2px solid var(--line); background:#fff; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
}
.search input:focus{border-color:var(--brand2); box-shadow:0 0 0 4px rgba(255,61,139,.14)}
.search .mag{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1.2rem; opacity:.6}
.search .clear{position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:#f1eef7;
  border-radius:999px; width:30px; height:30px; font-size:1rem; display:none; place-items:center}
.select{
  font-size:1rem; font-weight:800; padding:13px 16px; border-radius:14px; border:2px solid var(--line);
  background:#fff; color:var(--ink); outline:none;
}
.btn-random{
  border:none; color:#fff; font-weight:900; font-size:1rem; padding:14px 22px; border-radius:14px;
  background:linear-gradient(120deg,var(--brand1),var(--brand2)); box-shadow:0 8px 22px rgba(255,61,139,.35);
  transition:transform .15s, box-shadow .15s;
}
.btn-random:hover{transform:translateY(-2px) scale(1.02); box-shadow:0 12px 30px rgba(255,61,139,.45)}
.btn-random:active{transform:scale(.97)}

.chips{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.chip{
  border:2px solid transparent; background:#fff; color:var(--ink); font-weight:800; font-size:.95rem;
  padding:9px 15px; border-radius:999px; display:inline-flex; align-items:center; gap:8px;
  box-shadow:0 3px 10px rgba(31,36,64,.06); transition:transform .12s, box-shadow .12s, background .12s;
}
.chip:hover{transform:translateY(-2px)}
.chip .dot{width:12px; height:12px; border-radius:50%}
.chip .n{font-size:.78rem; font-weight:900; opacity:.75; background:rgba(0,0,0,.06); padding:1px 8px; border-radius:999px}
.chip.on{color:#fff; box-shadow:var(--shadow)}

/* ---------- Distribution bars ---------- */
.dist{margin-top:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.dbar{background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 13px; cursor:pointer; transition:transform .12s, box-shadow .12s}
.dbar:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.dbar .top{display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:.9rem; margin-bottom:7px}
.dbar .top .cnt{font-weight:900}
.dbar .track{height:9px; border-radius:999px; background:#eee9f2; overflow:hidden}
.dbar .fill{height:100%; border-radius:999px; width:0; transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* ---------- Result meta ---------- */
.meta{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin:26px 0 14px}
.meta .count{font-weight:900; font-size:1.15rem}
.meta .count em{font-style:normal; color:var(--brand2); font-size:1.4rem}
.tag-active{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:5px 12px; font-weight:800; font-size:.85rem}
.tag-active button{border:none; background:none; font-size:1rem; line-height:1; color:var(--ink-soft)}

/* ---------- Grid & Book cards ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px; padding-bottom:40px}
.book{
  background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
  border:1px solid var(--line); cursor:pointer; display:flex; flex-direction:column;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
  animation:pop .4s backwards;
}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.97)}to{opacity:1}}
.book:hover{transform:translateY(-8px) rotate(-.6deg); box-shadow:var(--shadow-lg)}
.book:focus-visible{outline:3px solid var(--brand2); outline-offset:3px}
.cover{
  position:relative; padding:20px 18px 18px 24px; min-height:158px; display:flex; flex-direction:column; justify-content:space-between;
  color:#fff;
}
.cover::before{content:""; position:absolute; left:0; top:0; bottom:0; width:9px; background:rgba(0,0,0,.22)}
.cover .cat{font-size:.8rem; font-weight:900; letter-spacing:.5px; display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.22); padding:4px 11px; border-radius:999px; align-self:flex-start; backdrop-filter:blur(2px)}
.cover .ct{font-size:1.16rem; line-height:1.35; font-weight:900; margin-top:12px;
  text-shadow:0 2px 8px rgba(0,0,0,.28);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.newbadge{position:absolute; top:12px; right:12px; background:#fff; color:#e8590c; font-weight:900; font-size:.72rem;
  padding:4px 9px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,.2); transform:rotate(6deg)}
.info{padding:13px 16px 15px; display:flex; flex-direction:column; gap:5px}
.info .au{font-weight:800; font-size:.95rem; color:var(--ink)}
.info .pb{font-size:.85rem; color:var(--ink-soft); font-weight:600}
.info .foot{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
.info .yr{font-weight:900; font-size:.85rem; color:var(--brand2)}
.info .rn{font-size:.72rem; color:#9aa0b5}
.fav-mini{border:none; background:#f4f0fa; border-radius:999px; width:34px; height:34px; font-size:1rem; display:grid; place-items:center;
  transition:transform .12s, background .12s}
.fav-mini:hover{transform:scale(1.15)}
.fav-mini.on{background:#ffe1ee}

.empty{grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--ink-soft)}
.empty .big{font-size:3rem}
.empty h3{font-size:1.4rem; margin:.4em 0 .2em; color:var(--ink)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; z-index:60; background:rgba(31,36,64,.55); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity .2s;
}
.overlay.show{display:flex; opacity:1}
.modal{
  background:#fff; border-radius:26px; max-width:640px; width:100%; max-height:90vh; overflow:auto;
  box-shadow:var(--shadow-lg); transform:scale(.9) translateY(10px); transition:transform .25s cubic-bezier(.2,.9,.3,1.2);
}
.overlay.show .modal{transform:scale(1) translateY(0)}
.m-cover{position:relative; padding:34px 34px 28px; color:#fff}
.m-cover .cat{font-size:.9rem; font-weight:900; background:rgba(255,255,255,.22); padding:6px 14px; border-radius:999px;
  display:inline-flex; gap:7px; align-items:center; backdrop-filter:blur(2px)}
.m-cover h2{font-size:clamp(1.5rem,4vw,2rem); line-height:1.3; margin:16px 0 6px; font-weight:900; text-shadow:0 2px 10px rgba(0,0,0,.25)}
.m-cover .m-au{font-weight:800; font-size:1.1rem; opacity:.96}
.m-close{position:absolute; top:16px; right:16px; border:none; background:rgba(255,255,255,.9); color:var(--ink);
  width:42px; height:42px; border-radius:50%; font-size:1.3rem; font-weight:900; display:grid; place-items:center;
  transition:transform .15s}
.m-close:hover{transform:rotate(90deg) scale(1.08)}
.m-body{padding:24px 30px 30px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.field{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:13px 16px}
.field.full{grid-column:1/-1}
.field label{display:block; font-size:.78rem; font-weight:900; color:var(--ink-soft); letter-spacing:1px; margin-bottom:3px}
.field .v{font-size:1.08rem; font-weight:800; word-break:break-all}
.m-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap}
.m-actions button{flex:1; min-width:150px; border:none; border-radius:14px; padding:15px; font-weight:900; font-size:1rem;
  transition:transform .15s, box-shadow .15s}
.m-actions button:hover{transform:translateY(-2px)}
.btn-fav{background:#fff0f6; color:#c2185b; border:2px solid #ffc4de !important}
.btn-fav.on{background:linear-gradient(120deg,var(--brand1),var(--brand2)); color:#fff; border-color:transparent !important}
.btn-nav{background:#f1eef8; color:var(--ink)}

/* ---------- Toast ---------- */
.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(30px);
  background:var(--ink); color:#fff; padding:13px 24px; border-radius:14px; font-weight:800; z-index:80;
  opacity:0; transition:transform .3s, opacity .3s; box-shadow:var(--shadow-lg); pointer-events:none; max-width:90vw}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- Back to top ---------- */
.totop{position:fixed; right:20px; bottom:24px; z-index:50; width:52px; height:52px; border-radius:50%; border:none;
  background:linear-gradient(135deg,var(--brand1),var(--brand2)); color:#fff; font-size:1.4rem; box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s}
.totop.show{opacity:1; pointer-events:auto}
.totop:hover{transform:translateY(-4px)}

footer{text-align:center; padding:40px 20px 60px; color:var(--ink-soft); font-weight:600}
footer b{color:var(--ink)}

@media (max-width:560px){
  :root{--fs-base:16px}
  .fields{grid-template-columns:1fr}
  .stat{flex:1; min-width:calc(50% - 7px)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">📚</div>
    <div>楊梅高中圖書館<small>YMHS LIBRARY ・ 新書展</small></div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="favBtn" title="我的書單">💛 我的書單 <span class="badge" id="favCount">0</span></button>
  <button class="iconbtn" id="soundBtn" title="開關音效">🔊</button>
</div>

<header class="hero">
  <div class="float" style="--r:8deg; width:78px; height:104px; right:8%; top:14%; background:linear-gradient(140deg,#ec4899,#be185d); animation-delay:0s"></div>
  <div class="float" style="--r:-10deg; width:66px; height:90px; right:20%; top:44%; background:linear-gradient(140deg,#14b8a6,#0f766e); animation-delay:1.1s"></div>
  <div class="float" style="--r:6deg; width:72px; height:96px; right:3%; top:52%; background:linear-gradient(140deg,#8b5cf6,#6d28d9); animation-delay:2s"></div>
  <div class="float" style="--r:-6deg; width:60px; height:82px; right:26%; top:10%; background:linear-gradient(140deg,#f59e0b,#d97706); animation-delay:.6s"></div>
  <div class="float" style="--r:12deg; width:70px; height:94px; right:32%; top:62%; background:linear-gradient(140deg,#3b82f6,#1d4ed8); animation-delay:1.6s"></div>
  <div class="hero-inner">
    <span class="eyebrow">✨ 115 學年度・新書開箱</span>
    <h1>翻開新書，<br><span class="grad">遇見下一個喜歡的故事</span></h1>
    <p class="lead">全館新到館藏一次看！搜尋、分類瀏覽、隨機抽書，把想讀的書加進你的書單。</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="wrap">
  <section class="panel">
    <div class="searchrow">
      <div class="search">
        <span class="mag">🔍</span>
        <input id="q" type="search" placeholder="搜尋書名、作者、出版社、ISBN 或登錄號…" autocomplete="off">
        <button class="clear" id="clearQ" title="清除">✕</button>
      </div>
      <select class="select" id="yearSel"><option value="">全部年份</option></select>
      <select class="select" id="sortSel">
        <option value="id">登錄號排序</option>
        <option value="ynew">出版年（新→舊）</option>
        <option value="yold">出版年（舊→新）</option>
        <option value="title">書名筆順</option>
      </select>
      <button class="btn-random" id="randomBtn">🎲 隨機推薦一本</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="dist" id="dist"></div>
  </section>

  <div class="meta">
    <div class="count">共 <em id="resCount">0</em> 本書</div>
    <div id="activeTags"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<footer>
  <b>楊梅高中圖書館</b> ・ 115 學年度新書展 ｜ 共 <span id="totalFoot">0</span> 本新書<br>
  點一本書看看它的故事吧！📖
</footer>

<button class="totop" id="toTop" title="回到頂端">↑</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

/* ---------------- Sound (Web Audio API) ---------------- */
let AC=null, soundOn=true;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(freq,dur=0.09,type='sine',vol=0.14,slide=0){
  if(!soundOn) return; const a=ac(); if(!a) return;
  if(a.state==='suspended') a.resume();
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(60,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol,a.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
const S={
  tap:()=>beep(520,0.06,'triangle',0.10),
  click:()=>beep(660,0.07,'sine',0.12,120),
  open:()=>{beep(440,0.09,'sine',0.12,180); setTimeout(()=>beep(660,0.10,'sine',0.11),70);},

  fav:()=>{beep(700,0.08,'triangle',0.13); setTimeout(()=>beep(950,0.10,'triangle',0.12),80);},
  unfav:()=>beep(300,0.10,'sine',0.10,-100),
  random:()=>{[0,80,160,240].forEach((d,i)=>setTimeout(()=>beep(500+i*140,0.09,'square',0.09),d));
    setTimeout(()=>{beep(880,0.14,'triangle',0.15); beep(1320,0.16,'sine',0.12);},360);},
  page:()=>beep(600,0.05,'sine',0.08),
};

let favs=new Set();
try{ const s=localStorage.getItem('ymhs_favs'); if(s) favs=new Set(JSON.parse(s)); }catch(e){}
function saveFavs(){ try{ localStorage.setItem('ymhs_favs', JSON.stringify([...favs])); }catch(e){} }
function isFav(id){ return favs.has(id); }
function toggleFav(id){
  if(favs.has(id)){ favs.delete(id); S.unfav(); } else { favs.add(id); S.fav(); }
  saveFavs(); updateFavUI();
}
function updateFavUI(){
  document.getElementById('favCount').textContent = favs.size;
  document.querySelectorAll('.fav-mini').forEach(el=>{
    const on=isFav(el.dataset.id); el.classList.toggle('on',on); el.textContent=on?'💛':'🤍';
  });
  const mfav=document.querySelector('.btn-fav');
  if(mfav){ const on=isFav(mfav.dataset.id); mfav.classList.toggle('on',on);
    mfav.textContent=on?'💛 已在我的書單':'🤍 加入我的書單'; }
}

/* ---------------- State ---------------- */
let state={ q:'', cat:'', year:'', sort:'id', favOnly:false };
let view=[];

/* ---------------- Build controls ---------------- */
function buildStats(){
  const years=BOOKS.map(b=>+b.year).filter(Boolean);
  const pubs=new Set(BOOKS.map(b=>b.pub));
  const cats=new Set(BOOKS.map(b=>b.m));
  const news=BOOKS.filter(b=>+b.year>=2026).length;
  const s=[['📚',BOOKS.length,'新書總數'],['🗂️',cats.size,'分類主題'],['🏢',pubs.size,'出版社'],['🆕',news,'2026 最新']];
  document.getElementById('stats').innerHTML=s.map(([e,n,l])=>
    `<div class="stat"><b data-n="${n}">0</b><span>${e} ${l}</span></div>`).join('');
  document.getElementById('totalFoot').textContent=BOOKS.length;
  // count up
  document.querySelectorAll('.stat b').forEach(el=>{
    const t=+el.dataset.n; let cur=0; const step=Math.max(1,Math.round(t/34));
    const iv=setInterval(()=>{cur+=step; if(cur>=t){cur=t; clearInterval(iv);} el.textContent=cur;},22);
  });
}
function buildChips(){
  const counts={}; BOOKS.forEach(b=>counts[b.m]=(counts[b.m]||0)+1);
  const keys=Object.keys(CATS).filter(k=>counts[k]).sort();
  let html=`<button class="chip" data-cat="" style="border-color:var(--line)"><span class="dot" style="background:linear-gradient(120deg,var(--brand1),var(--brand2))"></span>全部 <span class="n">${BOOKS.length}</span></button>`;
  html+=keys.map(k=>{const c=CATS[k];return `<button class="chip" data-cat="${k}"><span class="dot" style="background:${c.c}"></span>${c.emoji} ${c.name} <span class="n">${counts[k]}</span></button>`;}).join('');
  document.getElementById('chips').innerHTML=html;
  document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    state.cat=ch.dataset.cat; state.favOnly=false; S.tap(); render();
  }));

  // distribution bars
  const max=Math.max(...keys.map(k=>counts[k]));
  document.getElementById('dist').innerHTML=keys.map(k=>{const c=CATS[k];return `<div class="dbar" data-cat="${k}">
      <div class="top"><span>${c.emoji} ${c.name}</span><span class="cnt" style="color:${c.c}">${counts[k]}</span></div>
      <div class="track"><div class="fill" data-w="${counts[k]/max*100}" style="background:linear-gradient(90deg,${c.g1},${c.g2})"></div></div>
    </div>`;}).join('');
  document.querySelectorAll('.dbar').forEach(d=>d.addEventListener('click',()=>{
    state.cat=d.dataset.cat; state.favOnly=false; S.tap(); render();
    document.querySelector('.meta').scrollIntoView({behavior:'smooth',block:'start'});
  }));
  setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),200);
}
function buildYears(){
  const ys=[...new Set(BOOKS.map(b=>b.year))].filter(Boolean).sort((a,b)=>b-a);
  document.getElementById('yearSel').insertAdjacentHTML('beforeend',
    ys.map(y=>`<option value="${y}">${y} 年</option>`).join(''));
}

/* ---------------- Filter + render ---------------- */
function compute(){
  const q=state.q.trim().toLowerCase();
  let arr=BOOKS.filter(b=>{
    if(state.favOnly && !favs.has(b.id)) return false;
    if(state.cat && b.m!==state.cat) return false;
    if(state.year && b.year!==state.year) return false;
    if(q){
      const hay=(b.title+' '+b.author+' '+b.pub+' '+b.isbn+' '+b.id+' '+b.cls).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s=state.sort;
  arr.sort((a,b)=>{
    if(s==='ynew') return (+b.year||0)-(+a.year||0) || a.id.localeCompare(b.id);
    if(s==='yold') return (+a.year||0)-(+b.year||0) || a.id.localeCompare(b.id);
    if(s==='title') return a.title.localeCompare(b.title,'zh-Hant');
    return a.id.localeCompare(b.id);
  });
  return arr;
}
function bookCard(b,i){
  const c=catOf(b);
  const isNew=+b.year>=2026;
  return `<article class="book" tabindex="0" data-idx="${i}" style="animation-delay:${Math.min(i,20)*22}ms">
    <div class="cover" style="background:${grad(b)}">
      ${isNew?'<span class="newbadge">🆕 新書</span>':''}
      <span class="cat">${c.emoji} ${c.name}</span>
      <div class="ct">${esc(b.title)}</div>
    </div>
    <div class="info">
      <div class="au">✍️ ${esc(b.author||'—')}</div>
      <div class="pb">🏢 ${esc(b.pub||'—')}</div>
      <div class="foot">
        <div><span class="yr">${b.year||'—'}</span> <span class="rn mono">#${b.id}</span></div>
        <button class="fav-mini ${isFav(b.id)?'on':''}" data-id="${b.id}" title="加入我的書單">${isFav(b.id)?'💛':'🤍'}</button>
      </div>
    </div>
  </article>`;
}
function render(){
  // sync chip active
  document.querySelectorAll('.chip').forEach(ch=>{
    const on = ch.dataset.cat===state.cat && !state.favOnly;
    ch.classList.toggle('on',on);
    if(on && ch.dataset.cat){ const c=CATS[ch.dataset.cat]; ch.style.background=c.c; }
    else ch.style.background='';
  });
  view=compute();
  document.getElementById('resCount').textContent=view.length;

  // active tags
  const tags=[];
  if(state.favOnly) tags.push(`<span class="tag-active">💛 我的書單 <button data-clr="fav">✕</button></span>`);
  if(state.cat) tags.push(`<span class="tag-active">${CATS[state.cat].emoji} ${CATS[state.cat].name} <button data-clr="cat">✕</button></span>`);
  if(state.year) tags.push(`<span class="tag-active">📅 ${state.year} 年 <button data-clr="year">✕</button></span>`);
  if(state.q) tags.push(`<span class="tag-active">🔍 「${esc(state.q)}」 <button data-clr="q">✕</button></span>`);
  const at=document.getElementById('activeTags'); at.innerHTML=tags.join(' ');
  at.querySelectorAll('[data-clr]').forEach(btn=>btn.addEventListener('click',()=>{
    const k=btn.dataset.clr; S.tap();
    if(k==='fav') state.favOnly=false; else if(k==='q'){state.q='';document.getElementById('q').value='';document.getElementById('clearQ').style.display='none';} else state[k]='';
    if(k==='cat') document.getElementById('yearSel');
    if(k==='year') document.getElementById('yearSel').value='';
    render();
  }));

  const grid=document.getElementById('grid');
  if(!view.length){
    grid.innerHTML=`<div class="empty"><div class="big">🔍📭</div><h3>找不到符合的書</h3><p>換個關鍵字，或清除篩選條件再試一次。</p></div>`;
    return;
  }
  grid.innerHTML=view.map((b,i)=>bookCard(b,i)).join('');
  grid.querySelectorAll('.book').forEach(el=>{
    el.addEventListener('click',e=>{ if(e.target.closest('.fav-mini')) return; openModal(+el.dataset.idx); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); openModal(+el.dataset.idx);} });
  });
  grid.querySelectorAll('.fav-mini').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation(); toggleFav(el.dataset.id);
  }));
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- Modal ---------------- */
let modalIdx=-1;
function openModal(idx){
  modalIdx=idx; const b=view[idx]; if(!b) return; const c=catOf(b);
  S.open();
  document.getElementById('modal').innerHTML=`
    <div class="m-cover" style="background:${grad(b)}">
      <button class="m-close" id="mClose" title="關閉">✕</button>
      <span class="cat">${c.emoji} ${c.name}</span>
      <h2>${esc(b.title)}</h2>
      <div class="m-au">✍️ ${esc(b.author||'—')}</div>
    </div>
    <div class="m-body">
      <div class="fields">
        <div class="field"><label>出版社</label><div class="v">${esc(b.pub||'—')}</div></div>
        <div class="field"><label>出版年</label><div class="v">${b.year||'—'} 年</div></div>
        <div class="field"><label>分類號</label><div class="v mono">${esc(b.cls||'—')}</div></div>
        <div class="field"><label>登錄號</label><div class="v mono">${esc(b.id)}</div></div>
        <div class="field full"><label>ISBN</label><div class="v mono">${esc(b.isbn||'—')}</div></div>
      </div>
      <div class="m-actions">
        <button class="btn-nav" id="prevBtn">← 上一本</button>
        <button class="btn-fav ${isFav(b.id)?'on':''}" data-id="${b.id}" id="favToggle">${isFav(b.id)?'💛 已在我的書單':'🤍 加入我的書單'}</button>
        <button class="btn-nav" id="nextBtn">下一本 →</button>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
  document.getElementById('mClose').addEventListener('click',closeModal);
  document.getElementById('favToggle').addEventListener('click',()=>toggleFav(b.id));
  document.getElementById('prevBtn').addEventListener('click',()=>nav(-1));
  document.getElementById('nextBtn').addEventListener('click',()=>nav(1));
}
function nav(d){ let n=modalIdx+d; if(n<0)n=view.length-1; if(n>=view.length)n=0; S.page(); openModal(n); }
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow=''; S.close(); modalIdx=-1;
}

/* ---------------- Random ---------------- */
function randomPick(){
  const pool=compute(); if(!pool.length){ toast('目前沒有可推薦的書，換個條件吧！'); return; }
  S.random();
  view=pool;
  let ticks=0; const total=14;
  const iv=setInterval(()=>{
    const r=Math.floor(Math.random()*pool.length);
    highlight(r); ticks++;
    if(ticks>=total){ clearInterval(iv); const final=Math.floor(Math.random()*pool.length);
      setTimeout(()=>{ openModal(final); toast('🎉 為你抽到一本書！'); },160); }
  },70);
}
function highlight(i){ /* light feedback via toast pulse only to avoid heavy DOM churn */ }

/* ---------------- Toast ---------------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------------- Events ---------------- */
const qInput=document.getElementById('q'), clearQ=document.getElementById('clearQ');
qInput.addEventListener('input',()=>{ state.q=qInput.value; clearQ.style.display=qInput.value?'grid':'none'; render(); });
clearQ.addEventListener('click',()=>{ qInput.value=''; state.q=''; clearQ.style.display='none'; qInput.focus(); S.tap(); render(); });
document.getElementById('yearSel').addEventListener('change',e=>{ state.year=e.target.value; S.tap(); render(); });
document.getElementById('sortSel').addEventListener('change',e=>{ state.sort=e.target.value; S.tap(); render(); });
document.getElementById('randomBtn').addEventListener('click',randomPick);
document.getElementById('favBtn').addEventListener('click',()=>{
  state.favOnly=!state.favOnly; state.cat=''; S.tap();
  if(state.favOnly && favs.size===0) toast('你的書單還是空的，先去收藏喜歡的書吧！💛');
  render(); document.querySelector('.meta').scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('soundBtn').addEventListener('click',e=>{
  soundOn=!soundOn; e.currentTarget.textContent=soundOn?'🔊':'🔇';
  if(soundOn){ac(); S.click(); toast('音效已開啟 🔊');} else toast('音效已關閉 🔇');
});
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && modalIdx>=0) closeModal();
  else if(modalIdx>=0 && e.key==='ArrowLeft') nav(-1);
  else if(modalIdx>=0 && e.key==='ArrowRight') nav(1);
  else if(e.key==='/' && document.activeElement!==qInput){ e.preventDefault(); qInput.focus(); }
});
const toTop=document.getElementById('toTop');
window.addEventListener('scroll',()=>toTop.classList.toggle('show',window.scrollY>500));
toTop.addEventListener('click',()=>{ window.scrollTo({top:0,behavior:'smooth'}); S.tap(); });

/* ---------------- Init ---------------- */
buildStats(); buildChips(); buildYears(); updateFavUI(); render();
</script>
</body>
</html>
